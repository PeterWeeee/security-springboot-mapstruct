<!DOCTYPE html>
<html lang="vi"
 xmlns:th="http://www.thymeleaf.org">
<body>
<header th:fragment="header" class="topbar">
 <nav>
 <a th:href="@{/}" class="brand" style="font-size:22px; font-weight:bold; color:white; text-decoration:none;">
 UTEShop
 </a>
 </nav>
 <div class="account" th:if="${#authorization.expression('isAuthenticated()')}">
 <!-- Avatar -->
 <img
 th:src="${#authentication.principal.images != null
 and !#strings.isEmpty(#authentication.principal.images)
 ? #authentication.principal.images
 : '/images/avatar-default.png'}"
 alt="Avatar"
 width="40"
 height="40"
 style="border-radius:50%; object-fit:cover; vertical-align:middle;">
 <!-- Full name -->
 <span
 th:text="${#authentication.principal.fullName}">
 Nguyễn Văn A
 </span>
 <!-- Username -->
 <span
 th:text="'(' + ${#authentication.principal.username} + ')'">
 (nguyenvana)
 </span>
 <!-- Email -->
 <span
 th:text="${#authentication.principal.email}">
 email@gmail.com
 </span>
 <!-- Role -->
 <span
 th:text="${#authentication.principal.role}">
 ROLE_USER
 </span>
 <!-- Logout -->
 <form
 th:action="@{/logout}"
 method="post"
 style="display:inline">
 <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
 <button type="submit" class="link-button">
 Đăng xuất
 </button>
 </form>
 </div>
 <div class="account" th:unless="${#authorization.expression('isAuthenticated()')}">
 <a th:href="@{/login}" class="link-button" style="text-decoration:none; color:white;">
 Đăng nhập
 </a>
 </div>
</header>
</body>
</html>
